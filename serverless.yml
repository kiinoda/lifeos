# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: scaryfelidae
service: lifeos

# Single source of truth for the SSM Parameter Store location of the app config.
custom:
  ssmBasePath: /personal/daily_schedule
  ssmParameterName: config
  ssmPath: ${self:custom.ssmBasePath}/${self:custom.ssmParameterName}

provider:
  name: aws
  runtime: provided.al2023
  region: eu-west-1
  architecture: x86_64
  stage: dev
  iam:
    role:
      statements:
      - Effect: Allow
        Action:
        - ssm:GetParametersByPath
        Resource: "arn:aws:ssm:${self:provider.region}:${aws:accountId}:parameter${self:custom.ssmBasePath}/*"
      - Effect: Allow
        Action:
        - ses:SendEmail
        Resource: "arn:aws:ses:*"
  environment:
    LIFEOS_SSM_PATH: ${self:custom.ssmPath}

package:
  patterns:
  - '!./**'
  - ./bootstrap

functions:
  daily_schedule:
    handler: bootstrap
    memorySize: 128
    timeout: 20
    environment:
      LIFEOS_ACTION: daily_schedule
    events:
    - schedule: cron(45 3 ? * * *)
  event_schedule:
    handler: bootstrap
    memorySize: 128
    timeout: 20
    environment:
      LIFEOS_ACTION: event_schedule
    events:
    - schedule: cron(45 3 ? * * *)
  event_notification:
    handler: bootstrap
    memorySize: 128
    timeout: 20
    environment:
      LIFEOS_ACTION: event_notification
    events:
    - schedule: cron(3/5 * ? * * *)
  # # weekly notifications (run every week)
  # monthly:
  #   handler: bin/monthly
  #   memorySize: 128
  #   timeout: 20
  #   events:
  #   - schedule: cron(45 3 ? * * *)
  # invoice reminder on the 15th
  invoice_reminder:
    handler: bootstrap
    memorySize: 128
    timeout: 20
    environment:
      LIFEOS_ACTION: invoice_reminder
    events:
    - schedule: cron(0 5 14 * ? *)
